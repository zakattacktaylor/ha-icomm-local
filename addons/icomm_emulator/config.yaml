name: iCOMM local cloud service
version: "0.4.0-dev4"
slug: icomm_emulator
description: Local-only iCOMM HTTPS and UDP cloud replacement
arch:
  - aarch64
  - amd64
startup: services
boot: manual
stage: experimental
init: false
host_network: true
watchdog: "tcp://[HOST]:8787"
options:
  api_token: ""
  allowed_peers: []
  emulator_autostart: false
schema:
  api_token: password
  emulator_autostart: bool
  allowed_peers:
    - str
